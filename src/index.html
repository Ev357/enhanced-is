<!doctype html>
<html lang="en" class="scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/icon.png" />
    <link rel="stylesheet" href="tailwindcss" />
    <title>Enhanced IS</title>
  </head>
  <body>
    <div class="flex flex-col p-4">
      <div class="flex gap-4">
        <div class="flex w-5xl flex-col">
          <div class="mb-2 flex justify-between">
            <div class="w-20 shrink-0"></div>
            <div class="flex w-full justify-center"><p>Mon</p></div>
            <div class="flex w-full justify-center"><p>Tue</p></div>
            <div class="flex w-full justify-center"><p>Wed</p></div>
            <div class="flex w-full justify-center"><p>Thu</p></div>
            <div class="flex w-full justify-center"><p>Fri</p></div>
          </div>

          <div
            class="flex justify-between rounded border bg-[linear-gradient(to_bottom,transparent_59px,white_60px)] bg-size-[100%_60px]"
          >
            <div class="flex w-20 shrink-0 flex-col">
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                01:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                02:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                03:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                04:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                05:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                06:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                07:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                08:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                09:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                10:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                11:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                12:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                13:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                14:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                15:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                16:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                17:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                18:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                19:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                20:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                21:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                22:00
              </div>
              <div class="flex h-[60px] items-end justify-end pr-2 text-sm">
                23:00
              </div>
            </div>

            <div class="relative h-[1440px] w-full border-l" id="Mon"></div>
            <div class="relative h-[1440px] w-full border-l" id="Tue"></div>
            <div class="relative h-[1440px] w-full border-l" id="Wed"></div>
            <div class="relative h-[1440px] w-full border-l" id="Thu"></div>
            <div class="relative h-[1440px] w-full border-l" id="Fri"></div>
          </div>
        </div>
        <div class="flex w-64 flex-col gap-2">
          <form class="flex flex-col gap-2 rounded border p-2" id="custom-form">
            <input
              type="text"
              class="rounded border px-2 py-1"
              placeholder="Title"
              name="title"
              required
            />
            <input
              type="text"
              class="rounded border px-2 py-1"
              placeholder="Weekday"
              name="day"
              required
            />
            <input
              type="text"
              class="rounded border px-2 py-1"
              placeholder="From"
              name="from"
              required
            />
            <input
              type="text"
              class="rounded border px-2 py-1"
              placeholder="To"
              name="to"
              required
            />
            <button type="submit" class="rounded border">Add</button>
          </form>
          <div
            class="flex min-h-12 flex-col gap-2 rounded border p-2"
            id="customs"
          ></div>
        </div>
      </div>

      <div class="flex items-center py-8">
        <div class="h-px w-full bg-white"></div>
      </div>

      <div class="flex gap-4" id="subjects"></div>
    </div>
    <script src="./index.ts"></script>
  </body>
</html>
